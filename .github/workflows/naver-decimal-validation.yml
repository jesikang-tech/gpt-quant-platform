name: NAVER Decimal Validation

on:
  push:
    branches:
      - validation/naver-decimal-tests
      - validation/naver-observation-isolated
    paths:
      - 'naver-decimal-validation/**'
      - 'collector/price_collector.py'
      - 'collector/ohlcv_backfill.py'
      - 'test_ohlcv_backfill.py'
      - 'test_price_test_import_safety.py'
      - 'price_test_support.py'
      - 'core/**'
      - 'config.py'
      - 'database.py'
      - 'repository.py'
      - 'api_server.py'
      - 'current_analysis.py'
      - 'ranking_analyzer.py'
      - 'factor_engine.py'
      - '.github/workflows/naver-decimal-validation.yml'

permissions:
  contents: read

jobs:
  decimal-validation:
    runs-on: ubuntu-24.04

    timeout-minutes: 10

    steps:
      - name: Checkout validation branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout: |
            naver-decimal-validation
            core/price_provenance_gate.py
            core/naver_persistence_entry.py
            collector/price_collector.py
            collector/ohlcv_backfill.py
            price_quality.py
            api_server.py
            current_analysis.py
            static/dashboard.js
            config.py
            core/ai_decision_adaptive_strategy.py
            core/ai_decision_engine.py
            core/ai_decision_explainability.py
            core/ai_decision_outcome_collector.py
            core/ai_decision_outcome_evaluation.py
            core/ai_decision_outcome_intelligence.py
            core/ai_decision_trend.py
            core/ai_decision_validation_action.py
            core/ai_decision_validation_explainability.py
            core/ai_decision_validation.py
            core/ai_final_decision_certification.py
            core/ai_final_decision_execution_assurance.py
            core/ai_final_decision_execution_control.py
            core/ai_final_decision_execution_feedback.py
            core/ai_final_decision_execution_monitoring.py
            core/ai_final_decision_governance.py
            core/ai_final_decision_integrated_intelligence.py
            core/ai_final_decision_integration.py
            core/ai_final_decision_lifecycle_governance_control.py
            core/ai_final_decision_lifecycle_intelligence.py
            core/ai_final_decision_master_control.py
            core/ai_final_decision_operational_intelligence.py
            core/ai_final_decision_orchestration.py
            core/ai_final_decision_reassessment.py
            core/ai_final_execution_decision.py
            core/decision_confidence_assessment.py
            core/decision_confidence_explainability.py
            core/decision_confidence_intelligence.py
            core/decision_confidence_recommendation.py
            core/market_regime.py
            core/market_strategy.py
            core/optimization_scoring.py
            core/platform_auth.py
            core/point_in_time_analysis.py
            core/portfolio_advisor.py
            core/portfolio_conversational.py
            core/portfolio_decision_intelligence.py
            core/portfolio_explainability.py
            core/portfolio_intelligence_score.py
            database.py
            factor_engine.py
            price_test_support.py
            ranking_analyzer.py
            repository.py
            test_ohlcv_backfill.py
            test_price_test_import_safety.py
          sparse-checkout-cone-mode: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'

      - name: Prepare isolated test directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/naver-decimal-check
          cp -R naver-decimal-validation/. /tmp/naver-decimal-check/
          cp core/price_provenance_gate.py /tmp/naver-decimal-check/core/price_provenance_gate.py
          cp core/naver_persistence_entry.py /tmp/naver-decimal-check/core/naver_persistence_entry.py
          mkdir -p /tmp/naver-decimal-check/integration_sources
          cp collector/price_collector.py /tmp/naver-decimal-check/integration_sources/price_collector.py
          cp price_quality.py /tmp/naver-decimal-check/price_quality.py
          cp api_server.py /tmp/naver-decimal-check/integration_sources/api_server_original.py
          cp current_analysis.py /tmp/naver-decimal-check/integration_sources/current_analysis.py
          cp static/dashboard.js /tmp/naver-decimal-check/integration_sources/dashboard.js

      - name: Stage legacy OHLCV provenance test
        shell: bash
        run: |
          mkdir -p /tmp/naver-decimal-check/collector
          cp collector/ohlcv_backfill.py /tmp/naver-decimal-check/collector/ohlcv_backfill.py
          cp naver-decimal-validation/test_ohlcv_backfill_provenance.py /tmp/naver-decimal-check/test_ohlcv_backfill_provenance.py
      - name: Install pytest
        shell: bash
        working-directory: /tmp/naver-decimal-check
        run: |
          python -m pip install pytest==8.3.5 Flask==3.1.1 pandas==2.3.3

      - name: Run NAVER Decimal tests
        shell: bash
        working-directory: /tmp/naver-decimal-check
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          PYTHONPATH: /tmp/naver-decimal-check
        run: |
          python -m pytest -q -p no:cacheprovider \
            test_naver_decimal_price_pipeline.py \
            test_naver_raw_observation.py test_real_evidence_verifier.py test_price_rebuild_preflight.py test_naver_http_response_validation.py test_naver_observed_row_regression.py test_naver_analysis_boundary.py test_naver_analysis_response.py test_naver_analysis_execution_boundary.py test_naver_api_entry_gate.py test_naver_api_route_execution.py test_naver_api_http_contract.py test_naver_real_api_execution.py test_naver_actual_integration.py test_price_provenance_integration.py \
            test_price_provenance_gate.py test_naver_persistence_entry.py test_naver_persistence_bypass.py test_naver_provenance_boundary.py test_naver_source_evidence.py test_naver_trust_anchor.py test_trading_session_eligibility.py test_price_integrity_decision.py test_price_integrity_unverified_regression.py test_price_quality_decision_adapter.py test_price_quality_integration.py test_naver_collector_boundary.py test_ohlcv_backfill_provenance.py
      - name: Run isolated rebuild adapter tests
        if: success()
        shell: bash
        working-directory: /tmp/naver-decimal-check
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          PYTHONPATH: /tmp/naver-decimal-check
        run: |
          python -m pytest -q -p no:cacheprovider -ra \
            test_price_rebuild_adapter.py

      - name: Stage isolated legacy OHLCV algorithm tests
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          legacy_dir=$(mktemp -d /tmp/legacy-ohlcv-check.XXXXXX)
          echo "LEGACY_OHLCV_DIR=$legacy_dir" >> "$GITHUB_ENV"
          # Explicit eager import closure; no operational data or conftest files.
          while IFS= read -r source; do
            cp --parents "$source" "$legacy_dir/"
          done <<'SOURCES'
          api_server.py
          collector/ohlcv_backfill.py
          config.py
          core/ai_decision_adaptive_strategy.py
          core/ai_decision_engine.py
          core/ai_decision_explainability.py
          core/ai_decision_outcome_collector.py
          core/ai_decision_outcome_evaluation.py
          core/ai_decision_outcome_intelligence.py
          core/ai_decision_trend.py
          core/ai_decision_validation_action.py
          core/ai_decision_validation_explainability.py
          core/ai_decision_validation.py
          core/ai_final_decision_certification.py
          core/ai_final_decision_execution_assurance.py
          core/ai_final_decision_execution_control.py
          core/ai_final_decision_execution_feedback.py
          core/ai_final_decision_execution_monitoring.py
          core/ai_final_decision_governance.py
          core/ai_final_decision_integrated_intelligence.py
          core/ai_final_decision_integration.py
          core/ai_final_decision_lifecycle_governance_control.py
          core/ai_final_decision_lifecycle_intelligence.py
          core/ai_final_decision_master_control.py
          core/ai_final_decision_operational_intelligence.py
          core/ai_final_decision_orchestration.py
          core/ai_final_decision_reassessment.py
          core/ai_final_execution_decision.py
          core/decision_confidence_assessment.py
          core/decision_confidence_explainability.py
          core/decision_confidence_intelligence.py
          core/decision_confidence_recommendation.py
          core/market_regime.py
          core/market_strategy.py
          core/optimization_scoring.py
          core/platform_auth.py
          core/point_in_time_analysis.py
          core/portfolio_advisor.py
          core/portfolio_conversational.py
          core/portfolio_decision_intelligence.py
          core/portfolio_explainability.py
          core/portfolio_intelligence_score.py
          core/price_provenance_gate.py
          current_analysis.py
          database.py
          factor_engine.py
          price_test_support.py
          ranking_analyzer.py
          repository.py
          test_ohlcv_backfill.py
          test_price_test_import_safety.py
          SOURCES

      - name: Install legacy OHLCV import dependency
        shell: bash
        run: python -m pip install finance-datareader==0.9.202

      - name: Run legacy OHLCV algorithms and selected cleanup cases serially
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          PYTHONPATH: ${{ env.LEGACY_OHLCV_DIR }}
          TMPDIR: ${{ env.LEGACY_OHLCV_DIR }}
        run: |
          set -euo pipefail
          test -n "${LEGACY_OHLCV_DIR:-}"
          test -d "$LEGACY_OHLCV_DIR"
          cd "$LEGACY_OHLCV_DIR"
          python -m pytest -q -p no:cacheprovider \
            --basetemp="$LEGACY_OHLCV_DIR/pytest-tmp" \
            test_ohlcv_backfill.py \
            'test_price_test_import_safety.py::test_quality_backfill_full_cleanup_on_failure[test_ohlcv_backfill-None]' \
            'test_price_test_import_safety.py::test_quality_backfill_full_cleanup_on_failure[test_ohlcv_backfill-assertion]' \
            'test_price_test_import_safety.py::test_quality_backfill_full_cleanup_on_failure[test_ohlcv_backfill-sql]' \
            'test_price_test_import_safety.py::test_quality_backfill_full_cleanup_on_failure[test_ohlcv_backfill-init]'
