name: NAVER Decimal Validation

on:
  push:
    branches:
      - validation/naver-decimal-tests
    paths:
      - 'naver-decimal-validation/**'
      - '.github/workflows/naver-decimal-validation.yml'

permissions:
  contents: read

jobs:
  decimal-validation:
    runs-on: ubuntu-24.04

    timeout-minutes: 10

    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Prepare isolated test directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/naver-decimal-check
          cp -R naver-decimal-validation/. /tmp/naver-decimal-check/

      - name: Install pytest
        shell: bash
        working-directory: /tmp/naver-decimal-check
        run: |
          python -m pip install pytest==8.3.5

      - name: Run NAVER Decimal tests
        shell: bash
        working-directory: /tmp/naver-decimal-check
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          python -m pytest -q -p no:cacheprovider \
            test_naver_decimal_price_pipeline.py