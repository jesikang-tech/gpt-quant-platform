name: NAVER Decimal Validation

on:
  push:
    branches:
      - validation/naver-decimal-tests
      - validation/naver-observation-isolated
    paths:
      - 'naver-decimal-validation/**'
      - 'providers/fdr_provider.py'
      - 'providers/base_provider.py'
      - 'test_fdr_provider_price_provenance_gate.py'
      - 'collector/price_collector.py'
      - 'collector/bulk_price_collector.py'
      - 'collector/incremental_price_updater.py'
      - 'test_collection_price_provenance_gate.py'
      - 'collector/ohlcv_backfill.py'
      - 'test_ohlcv_backfill.py'
      - 'test_repository_price_provenance_gate.py'
      - 'test_price_test_import_safety.py'
      - 'price_test_support.py'
      - 'core/**'
      - 'config.py'
      - 'database.py'
      - 'repository.py'
      - 'api_server.py'
      - 'current_analysis.py'
      - 'ranking_analyzer.py'
      - 'factor_engine.py'
      - '.github/workflows/naver-decimal-validation.yml'

permissions:
  contents: read

jobs:
  decimal-validation:
    runs-on: ubuntu-24.04

    timeout-minutes: 10

    steps:
      - name: Checkout validation branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout: |
            naver-decimal-validation
            providers/fdr_provider.py
            providers/base_provider.py
            test_fdr_provider_price_provenance_gate.py
            core/price_provenance_gate.py
            core/naver_persistence_entry.py
            core/period_analysis.py
            collector/price_collector.py
            collector/bulk_price_collector.py
            collector/incremental_price_updater.py
            test_collection_price_provenance_gate.py
            collector/ohlcv_backfill.py
            price_quality.py
            api_server.py
            current_analysis.py
            static/dashboard.js
            config.py
            core/ai_decision_adaptive_strategy.py
            core/ai_decision_engine.py
            core/ai_decision_explainability.py
            core/ai_decision_outcome_collector.py
            core/ai_decision_outcome_evaluation.py
            core/ai_decision_outcome_intelligence.py
            core/ai_decision_trend.py
            core/ai_decision_validation_action.py
            core/ai_decision_validation_explainability.py
            core/ai_decision_validation.py
            core/ai_final_decision_certification.py
            core/ai_final_decision_execution_assurance.py
            core/ai_final_decision_execution_control.py
            core/ai_final_decision_execution_feedback.py
            core/ai_final_decision_execution_monitoring.py
            core/ai_final_decision_governance.py
            core/ai_final_decision_integrated_intelligence.py
            core/ai_final_decision_integration.py
            core/ai_final_decision_lifecycle_governance_control.py
            core/ai_final_decision_lifecycle_intelligence.py
            core/ai_final_decision_master_control.py
            core/ai_final_decision_operational_intelligence.py
            core/ai_final_decision_orchestration.py
            core/ai_final_decision_reassessment.py
            core/ai_final_execution_decision.py
            core/decision_confidence_assessment.py
            core/decision_confidence_explainability.py
            core/decision_confidence_intelligence.py
            core/decision_confidence_recommendation.py
            core/market_regime.py
            core/market_strategy.py
            core/optimization_scoring.py
            core/platform_auth.py
            core/point_in_time_analysis.py
            core/portfolio_advisor.py
            core/portfolio_conversational.py
            core/portfolio_decision_intelligence.py
            core/portfolio_explainability.py
            core/portfolio_intelligence_score.py
            database.py
            factor_engine.py
            historical_replay.py
            price_test_support.py
            ranking_analyzer.py
            test_dashboard_api.py
            test_dashboard_data.py
            test_dashboard_json.py
            repository.py
            test_ohlcv_backfill.py
            test_repository_price_provenance_gate.py
            test_price_test_import_safety.py
          sparse-checkout-cone-mode: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'

      - name: Prepare isolated test directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/naver-decimal-check
          cp -R naver-decimal-validation/. /tmp/naver-decimal-check/
          cp core/price_provenance_gate.py /tmp/naver-decimal-check/core/price_provenance_gate.py
          cp core/naver_persistence_entry.py /tmp/naver-decimal-check/core/naver_persistence_entry.py
          mkdir -p /tmp/naver-decimal-check/integration_sources
          cp collector/price_collector.py /tmp/naver-decimal-check/integration_sources/price_collector.py
          cp price_quality.py /tmp/naver-decimal-check/price_quality.py
          cp api_server.py /tmp/naver-decimal-check/integration_sources/api_server_original.py
          cp current_analysis.py /tmp/naver-decimal-check/integration_sources/current_analysis.py
          cp static/dashboard.js /tmp/naver-decimal-check/integration_sources/dashboard.js

      - name: Stage legacy OHLCV provenance test
        shell: bash
        run: |
          mkdir -p /tmp/naver-decimal-check/collector
          cp collector/ohlcv_backfill.py /tmp/naver-decimal-check/collector/ohlcv_backfill.py
          cp naver-decimal-validation/test_ohlcv_backfill_provenance.py /tmp/naver-decimal-check/test_ohlcv_backfill_provenance.py
      - name: Install pytest
        shell: bash
        working-directory: /tmp/naver-decimal-check
        run: |
          python -m pip install pytest==8.3.5 Flask==3.1.1 pandas==2.3.3

      - name: Run NAVER Decimal tests
        shell: bash
        working-directory: /tmp/naver-decimal-check
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          PYTHONPATH: /tmp/naver-decimal-check
        run: |
          python -m pytest -q -p no:cacheprovider \
            test_naver_decimal_price_pipeline.py test_synthetic_decimal_atomic_batch.py \
            test_naver_raw_observation.py test_real_evidence_verifier.py test_price_rebuild_preflight.py test_naver_http_response_validation.py test_naver_observed_row_regression.py test_naver_analysis_boundary.py test_naver_analysis_response.py test_naver_analysis_execution_boundary.py test_naver_api_entry_gate.py test_naver_api_route_execution.py test_naver_api_http_contract.py test_naver_real_api_execution.py test_naver_actual_integration.py test_price_provenance_integration.py \
            test_price_provenance_gate.py test_naver_persistence_entry.py test_naver_persistence_bypass.py test_naver_provenance_boundary.py test_naver_source_evidence.py test_naver_trust_anchor.py test_trading_session_eligibility.py test_price_integrity_decision.py test_price_integrity_unverified_regression.py test_price_quality_decision_adapter.py test_price_quality_integration.py test_naver_collector_boundary.py test_ohlcv_backfill_provenance.py
      - name: Run isolated factor Decimal boundary tests
        if: success()
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          set -euo pipefail
          factor_dir=$(mktemp -d /tmp/factor-decimal-boundary.XXXXXX)
          mkdir -p "$factor_dir/naver-decimal-validation"
          cp factor_engine.py "$factor_dir/factor_engine.py"
          cp config.py "$factor_dir/config.py"
          cp naver-decimal-validation/test_factor_decimal_boundary.py \
            "$factor_dir/naver-decimal-validation/test_factor_decimal_boundary.py"
          cd "$factor_dir"
          PYTHONPATH="$factor_dir" TMPDIR="$factor_dir" \
            python -m pytest -q -p no:cacheprovider \
              --basetemp="$factor_dir/pytest-tmp" \
              naver-decimal-validation/test_factor_decimal_boundary.py
      - name: Run isolated Replay Decimal integration tests
        if: success()
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          set -euo pipefail
          replay_dir=$(mktemp -d /tmp/replay-decimal-integration.XXXXXX)
          mkdir -p "$replay_dir/naver-decimal-validation"
          cp historical_replay.py "$replay_dir/historical_replay.py"
          cp factor_engine.py "$replay_dir/factor_engine.py"
          cp config.py "$replay_dir/config.py"
          cp naver-decimal-validation/test_replay_decimal_integration.py \
            "$replay_dir/naver-decimal-validation/test_replay_decimal_integration.py"
          cd "$replay_dir"
          PYTHONPATH="$replay_dir" TMPDIR="$replay_dir" \
            python -m pytest -q -p no:cacheprovider \
              --basetemp="$replay_dir/pytest-tmp" \
              naver-decimal-validation/test_replay_decimal_integration.py
      - name: Install legacy OHLCV import dependency
        shell: bash
        run: python -m pip install finance-datareader==0.9.202
      - name: Run isolated dashboard regression tests
        if: success()
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          set -euo pipefail
          dashboard_dir=$(mktemp -d /tmp/dashboard-regression.XXXXXX)
          cp database.py config.py repository.py ranking_analyzer.py \
            price_test_support.py "$dashboard_dir/"
          mkdir -p "$dashboard_dir/core"
          cp core/price_provenance_gate.py "$dashboard_dir/core/"
          cp test_dashboard_api.py test_dashboard_data.py \
            test_dashboard_json.py "$dashboard_dir/"
          cd "$dashboard_dir"
          PYTHONPATH="$dashboard_dir" TMPDIR="$dashboard_dir" \
            python -m pytest -q -p no:cacheprovider \
              --basetemp="$dashboard_dir/pytest-tmp" \
              test_dashboard_api.py test_dashboard_data.py test_dashboard_json.py
      - name: Run isolated rebuild adapter tests
        if: success()
        shell: bash
        working-directory: /tmp/naver-decimal-check
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          PYTHONPATH: /tmp/naver-decimal-check
        run: |
          python -m pytest -q -p no:cacheprovider -ra \
            test_price_rebuild_adapter.py

      - name: Run isolated synthetic adjustment policy tests
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          set -euo pipefail
          policy_dir=$(mktemp -d /tmp/decimal-adjustment-policy.XXXXXX)
          cd naver-decimal-validation
          while IFS= read -r source; do
            cp --parents "$source" "$policy_dir/"
          done <<'SOURCES'
          test_decimal_adjustment_policy.py
          core/decimal_price_conflict.py
          core/decimal_source_integration.py
          core/decimal_synthetic_bridge.py
          core/naver_decimal_price_pipeline.py
          SOURCES
          cd "$policy_dir"
          PYTHONPATH="$policy_dir" TMPDIR="$policy_dir" \
            python -m pytest -q -p no:cacheprovider \
              --basetemp="$policy_dir/pytest-tmp" \
              test_decimal_adjustment_policy.py

      - name: Run isolated repository price provenance regressions
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          set -euo pipefail
          repository_dir=$(mktemp -d /tmp/repository-price-gate.XXXXXX)
          # No config.py, operational data, or conftest.py is staged.
          while IFS= read -r source; do
            cp --parents "$source" "$repository_dir/"
          done <<'SOURCES'
          test_repository_price_provenance_gate.py
          repository.py
          database.py
          core/price_provenance_gate.py
          SOURCES
          cd "$repository_dir"
          PYTHONPATH="$repository_dir" TMPDIR="$repository_dir" \
            python -m pytest -q -p no:cacheprovider \
              --basetemp="$repository_dir/pytest-tmp" \
              test_repository_price_provenance_gate.py

      - name: Run isolated collection price provenance regressions
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          set -euo pipefail
          collection_dir=$(mktemp -d /tmp/collection-price-gate.XXXXXX)
          # Dependencies with operational side effects are test-local sentinels.
          while IFS= read -r source; do
            cp --parents "$source" "$collection_dir/"
          done <<'SOURCES'
          test_collection_price_provenance_gate.py
          collector/price_collector.py
          collector/bulk_price_collector.py
          collector/incremental_price_updater.py
          core/price_provenance_gate.py
          SOURCES
          cd "$collection_dir"
          PYTHONPATH="$collection_dir" TMPDIR="$collection_dir" \
            python -m pytest -q -p no:cacheprovider \
              --basetemp="$collection_dir/pytest-tmp" \
              test_collection_price_provenance_gate.py

      - name: Run isolated direct FDR price provenance regression
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          set -euo pipefail
          provider_dir=$(mktemp -d /tmp/fdr-price-gate.XXXXXX)
          while IFS= read -r source; do
            cp --parents "$source" "$provider_dir/"
          done <<'SOURCES'
          test_fdr_provider_price_provenance_gate.py
          providers/fdr_provider.py
          providers/base_provider.py
          core/price_provenance_gate.py
          SOURCES
          cd "$provider_dir"
          PYTHONPATH="$provider_dir" TMPDIR="$provider_dir" \
            python -m pytest -q -p no:cacheprovider \
              --basetemp="$provider_dir/pytest-tmp" \
              test_fdr_provider_price_provenance_gate.py

      - name: Stage isolated legacy OHLCV algorithm tests
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          legacy_dir=$(mktemp -d /tmp/legacy-ohlcv-check.XXXXXX)
          echo "LEGACY_OHLCV_DIR=$legacy_dir" >> "$GITHUB_ENV"
          # Explicit eager import closure; no operational data or conftest files.
          while IFS= read -r source; do
            cp --parents "$source" "$legacy_dir/"
          done <<'SOURCES'
          api_server.py
          collector/ohlcv_backfill.py
          config.py
          core/ai_decision_adaptive_strategy.py
          core/ai_decision_engine.py
          core/ai_decision_explainability.py
          core/ai_decision_outcome_collector.py
          core/ai_decision_outcome_evaluation.py
          core/ai_decision_outcome_intelligence.py
          core/ai_decision_trend.py
          core/ai_decision_validation_action.py
          core/ai_decision_validation_explainability.py
          core/ai_decision_validation.py
          core/ai_final_decision_certification.py
          core/ai_final_decision_execution_assurance.py
          core/ai_final_decision_execution_control.py
          core/ai_final_decision_execution_feedback.py
          core/ai_final_decision_execution_monitoring.py
          core/ai_final_decision_governance.py
          core/ai_final_decision_integrated_intelligence.py
          core/ai_final_decision_integration.py
          core/ai_final_decision_lifecycle_governance_control.py
          core/ai_final_decision_lifecycle_intelligence.py
          core/ai_final_decision_master_control.py
          core/ai_final_decision_operational_intelligence.py
          core/ai_final_decision_orchestration.py
          core/ai_final_decision_reassessment.py
          core/ai_final_execution_decision.py
          core/decision_confidence_assessment.py
          core/decision_confidence_explainability.py
          core/decision_confidence_intelligence.py
          core/decision_confidence_recommendation.py
          core/market_regime.py
          core/market_strategy.py
          core/optimization_scoring.py
          core/platform_auth.py
          core/point_in_time_analysis.py
          core/portfolio_advisor.py
          core/portfolio_conversational.py
          core/portfolio_decision_intelligence.py
          core/portfolio_explainability.py
          core/portfolio_intelligence_score.py
          core/price_provenance_gate.py
          current_analysis.py
          database.py
          factor_engine.py
          price_test_support.py
          ranking_analyzer.py
          repository.py
          test_ohlcv_backfill.py
          test_price_test_import_safety.py
          SOURCES


      - name: Run legacy OHLCV algorithms and selected cleanup cases serially
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          PYTHONPATH: ${{ env.LEGACY_OHLCV_DIR }}
          TMPDIR: ${{ env.LEGACY_OHLCV_DIR }}
        run: |
          set -euo pipefail
          test -n "${LEGACY_OHLCV_DIR:-}"
          test -d "$LEGACY_OHLCV_DIR"
          cd "$LEGACY_OHLCV_DIR"
          python -m pytest -q -p no:cacheprovider \
            --basetemp="$LEGACY_OHLCV_DIR/pytest-tmp" \
            test_ohlcv_backfill.py \
            'test_price_test_import_safety.py::test_quality_backfill_full_cleanup_on_failure[test_ohlcv_backfill-None]' \
            'test_price_test_import_safety.py::test_quality_backfill_full_cleanup_on_failure[test_ohlcv_backfill-assertion]' \
            'test_price_test_import_safety.py::test_quality_backfill_full_cleanup_on_failure[test_ohlcv_backfill-sql]' \
            'test_price_test_import_safety.py::test_quality_backfill_full_cleanup_on_failure[test_ohlcv_backfill-init]'

      - name: Verify isolated period-analysis Decimal Green regressions
        if: ${{ !cancelled() }}
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          BASELINE_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          green_dir=$(mktemp -d /tmp/period-decimal-green.XXXXXX)
          mkdir -p "$green_dir/core"
          cp core/period_analysis.py "$green_dir/core/period_analysis.py"
          cp naver-decimal-validation/test_period_analysis_decimal_compatibility.py "$green_dir/"
          cd "$green_dir"
          export PYTHONPATH="$green_dir" TMPDIR="$green_dir"
          pytest_exit=0
          python -m pytest -q -p no:cacheprovider \
            --basetemp="$green_dir/pytest-tmp" --junitxml="$green_dir/results.xml" \
            test_period_analysis_decimal_compatibility.py::test_decimal_sub_float_increment_counts_as_up_day \
            test_period_analysis_decimal_compatibility.py::test_decimal_sub_float_increment_preserves_positive_return \
            'test_period_analysis_decimal_compatibility.py::test_decimal_threshold_uses_exact_pass_fail_boundary[exact_threshold]' \
            'test_period_analysis_decimal_compatibility.py::test_decimal_threshold_uses_exact_pass_fail_boundary[strictly_below_threshold]' \
            test_period_analysis_decimal_compatibility.py::test_legacy_float_threshold_does_not_round_decimal_shortfall_into_pass \
            test_period_analysis_decimal_compatibility.py::test_integer_price_inputs_preserve_existing_results || pytest_exit=$?
          export DECIMAL_GREEN_PYTEST_EXIT="$pytest_exit"
          # Preserve pytest failure status while inspecting the exact JUnit cases.
          python - <<'PY'
          import os
          from pathlib import Path
          import sys
          import xml.etree.ElementTree as ET

          expected = {
              "test_decimal_sub_float_increment_counts_as_up_day",
              "test_decimal_sub_float_increment_preserves_positive_return",
              "test_decimal_threshold_uses_exact_pass_fail_boundary[exact_threshold]",
              "test_decimal_threshold_uses_exact_pass_fail_boundary[strictly_below_threshold]",
              "test_legacy_float_threshold_does_not_round_decimal_shortfall_into_pass",
              "test_integer_price_inputs_preserve_existing_results",
          }
          problems = []
          try:
              root = ET.parse("results.xml").getroot()
              cases = root.findall(".//testcase")
              by_name = {case.get("name"): case for case in cases}
              if len(cases) != 6 or set(by_name) != expected:
                  problems.append("Expected exactly the six named Decimal/control cases")
              for case in cases:
                  if any(case.find(tag) is not None for tag in ("failure", "error", "skipped")):
                      problems.append(f"Case did not pass: {case.get('name')}")
              suites = list(root.iter("testsuite"))
              totals = {"tests": 6, "failures": 0, "errors": 0, "skipped": 0}
              if len(suites) != 1 or any(
                  int(suites[0].get(key, "-1")) != value for key, value in totals.items()
              ):
                  problems.append("JUnit totals must be 6 tests, 0 failures, 0 errors, 0 skipped")
          except (OSError, ET.ParseError, ValueError) as exc:
              problems.append(f"Missing or malformed pytest report: {exc}")
          if os.environ["DECIMAL_GREEN_PYTEST_EXIT"] != "0":
              problems.append("Pytest must exit 0")

          baseline = os.environ["BASELINE_STATUS"]
          outcome = "FAIL" if problems else "GREEN"
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
              summary.write(f"## Isolated Decimal Green regressions\n\nExisting stages before Green: {baseline}\n\n")
              summary.write(f"Decimal regression result: **{outcome}**\n\n")
              summary.write("Required: six named cases passed, zero failures/errors/skips, pytest exit 0.\n\n")
              summary.write("This step's Green result does not override failures in earlier validation stages.\n")
              for problem in problems:
                  summary.write(f"\n- {problem}\n")
          if problems:
              for problem in problems:
                  print(f"::error title=Decimal Green regression failure::{problem}")
              sys.exit(1)
          print("Decimal Green: all six named regression cases passed.")
          PY

      - name: Verify isolated Decimal query boundary Green regressions
        if: ${{ !cancelled() }}
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          BASELINE_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          query_dir=$(mktemp -d /tmp/period-decimal-query-green.XXXXXX)
          mkdir -p "$query_dir/core"
          cp core/period_analysis.py "$query_dir/core/period_analysis.py"
          cp naver-decimal-validation/test_period_analysis_decimal_compatibility.py "$query_dir/"
          cd "$query_dir"
          export PYTHONPATH="$query_dir" TMPDIR="$query_dir"
          pytest_exit=0
          python -m pytest -q -p no:cacheprovider \
            --basetemp="$query_dir/pytest-tmp" --junitxml="$query_dir/results.xml" \
            test_period_analysis_decimal_compatibility.py::test_query_boundary_preserves_decimal_prices_and_period_results \
            'test_period_analysis_decimal_compatibility.py::test_query_boundary_preserves_legacy_numeric_results[integer_rows]' \
            'test_period_analysis_decimal_compatibility.py::test_query_boundary_preserves_legacy_numeric_results[float_rows]' || pytest_exit=$?
          export DECIMAL_QUERY_PYTEST_EXIT="$pytest_exit"
          python - <<'PY'
          import os
          from pathlib import Path
          import sys
          import xml.etree.ElementTree as ET

          expected = {
              "test_query_boundary_preserves_decimal_prices_and_period_results",
              "test_query_boundary_preserves_legacy_numeric_results[integer_rows]",
              "test_query_boundary_preserves_legacy_numeric_results[float_rows]",
          }
          problems = []
          try:
              root = ET.parse("results.xml").getroot()
              cases = root.findall(".//testcase")
              by_name = {case.get("name"): case for case in cases}
              if len(cases) != 3 or set(by_name) != expected:
                  problems.append("Expected exactly the three named query-boundary cases")
              for case in cases:
                  if any(case.find(tag) is not None for tag in ("failure", "error", "skipped")):
                      problems.append(f"Query-boundary case did not pass: {case.get('name')}")
              suites = list(root.iter("testsuite"))
              totals = {"tests": 3, "failures": 0, "errors": 0, "skipped": 0}
              if len(suites) != 1 or any(
                  int(suites[0].get(key, "-1")) != value for key, value in totals.items()
              ):
                  problems.append("Expected 3 passes, 0 failures, 0 errors, 0 skips")
          except (OSError, ET.ParseError, ValueError) as exc:
              problems.append(f"Missing or malformed query-boundary report: {exc}")
          if os.environ["DECIMAL_QUERY_PYTEST_EXIT"] != "0":
              problems.append("Expected pytest exit 0 for the isolated query Green regressions")

          outcome = "FAIL" if problems else "GREEN"
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
              summary.write("## Isolated Decimal query-boundary Green verification\n\n")
              summary.write(f"Existing stages, including calculation Green: {os.environ['BASELINE_STATUS']}\n\n")
              summary.write(f"Query Green verification: **{outcome}**\n\n")
              summary.write("Required: all three named Decimal, integer and float query cases pass.\n\n")
              summary.write("Query Green does not override earlier CI failures.\n")
              for problem in problems:
                  summary.write(f"\n- {problem}\n")
          if problems:
              for problem in problems:
                  print(f"::error title=Decimal query Green failure::{problem}")
              sys.exit(1)
          print("Decimal query Green: all three named regression cases passed.")
          PY

      - name: Verify isolated Decimal JSON contracts with Flask 3.1.3
        if: ${{ !cancelled() }}
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          BASELINE_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          json_dir=$(mktemp -d /tmp/period-decimal-json.XXXXXX)
          mkdir -p "$json_dir/core"
          cp core/period_analysis.py "$json_dir/core/period_analysis.py"
          cp naver-decimal-validation/test_period_analysis_decimal_compatibility.py "$json_dir/"
          cd "$json_dir"
          export PYTHONPATH="$json_dir" TMPDIR="$json_dir"
          python -m venv "$json_dir/venv"
          "$json_dir/venv/bin/python" -m pip install pytest==8.3.5 Flask==3.1.3
          pytest_exit=0
          "$json_dir/venv/bin/python" -m pytest -q -p no:cacheprovider \
            --basetemp="$json_dir/pytest-tmp" --junitxml="$json_dir/results.xml" \
            test_period_analysis_decimal_compatibility.py::test_jsonify_decimal_analysis_preserves_strings_and_source \
            'test_period_analysis_decimal_compatibility.py::test_jsonify_legacy_analysis_preserves_json_numbers[integer_rows]' \
            'test_period_analysis_decimal_compatibility.py::test_jsonify_legacy_analysis_preserves_json_numbers[float_rows]' \
            test_period_analysis_decimal_compatibility.py::test_jsonify_distinguishes_close_decimal_strings || pytest_exit=$?
          export DECIMAL_JSON_PYTEST_EXIT="$pytest_exit"
          "$json_dir/venv/bin/python" - <<'PY'
          from importlib.metadata import version
          import os
          from pathlib import Path
          import sys
          import xml.etree.ElementTree as ET

          expected = {
              "test_jsonify_decimal_analysis_preserves_strings_and_source",
              "test_jsonify_legacy_analysis_preserves_json_numbers[integer_rows]",
              "test_jsonify_legacy_analysis_preserves_json_numbers[float_rows]",
              "test_jsonify_distinguishes_close_decimal_strings",
          }
          problems = []
          if version("Flask") != "3.1.3":
              problems.append("Expected Flask 3.1.3 in the isolated JSON environment")
          try:
              root = ET.parse("results.xml").getroot()
              cases = root.findall(".//testcase")
              if len(cases) != 4 or {case.get("name") for case in cases} != expected:
                  problems.append("Expected exactly the four named JSON serialization cases")
              for case in cases:
                  if any(case.find(tag) is not None for tag in ("failure", "error", "skipped")):
                      problems.append(f"JSON serialization case did not pass: {case.get('name')}")
              suites = list(root.iter("testsuite"))
              totals = {"tests": 4, "failures": 0, "errors": 0, "skipped": 0}
              if len(suites) != 1 or any(
                  int(suites[0].get(key, "-1")) != value for key, value in totals.items()
              ):
                  problems.append("Expected 4 passes, 0 failures, 0 errors, 0 skips")
          except (OSError, ET.ParseError, ValueError) as exc:
              problems.append(f"Missing or malformed JSON serialization report: {exc}")
          if os.environ["DECIMAL_JSON_PYTEST_EXIT"] != "0":
              problems.append("Expected pytest exit 0 for JSON serialization contracts")

          outcome = "FAIL" if problems else "GREEN"
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
              summary.write("## Isolated Decimal JSON contracts (Flask 3.1.3)\n\n")
              summary.write(f"Earlier stages, including the nine Green cases: {os.environ['BASELINE_STATUS']}\n\n")
              summary.write(f"JSON verification: **{outcome}**; requires four named passes and pytest exit 0.\n\n")
              summary.write("This result does not override earlier CI failures.\n")
              for problem in problems:
                  summary.write(f"\n- {problem}\n")
          if problems:
              for problem in problems:
                  print(f"::error title=Decimal JSON contract failure::{problem}")
              sys.exit(1)
          print("Decimal JSON Green: all four named cases passed with Flask 3.1.3.")
          PY
