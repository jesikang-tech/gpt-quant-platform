name: NAVER Decimal Validation

on:
  push:
    branches:
      - validation/naver-decimal-tests
      - validation/naver-observation-isolated
    paths:
      - 'naver-decimal-validation/**'
      - '.github/workflows/naver-decimal-validation.yml'

permissions:
  contents: read

jobs:
  decimal-validation:
    runs-on: ubuntu-24.04

    timeout-minutes: 10

    steps:
      - name: Checkout validation branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout: |
            naver-decimal-validation
            api_server.py
            current_analysis.py
            static/dashboard.js
          sparse-checkout-cone-mode: true

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'

      - name: Prepare isolated test directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/naver-decimal-check
          cp -R naver-decimal-validation/. /tmp/naver-decimal-check/
          mkdir -p /tmp/naver-decimal-check/integration_sources
          cp api_server.py /tmp/naver-decimal-check/integration_sources/api_server_original.py
          cp current_analysis.py /tmp/naver-decimal-check/integration_sources/current_analysis.py
          cp static/dashboard.js /tmp/naver-decimal-check/integration_sources/dashboard.js

      - name: Install pytest
        shell: bash
        working-directory: /tmp/naver-decimal-check
        run: |
          python -m pip install pytest==8.3.5 Flask==3.1.1

      - name: Run NAVER Decimal tests
        shell: bash
        working-directory: /tmp/naver-decimal-check
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          PYTHONPATH: /tmp/naver-decimal-check
        run: |
          python -m pytest -q -p no:cacheprovider \
            test_naver_decimal_price_pipeline.py \
            test_naver_raw_observation.py test_real_evidence_verifier.py test_price_rebuild_preflight.py test_naver_http_response_validation.py test_naver_observed_row_regression.py test_naver_analysis_boundary.py test_naver_analysis_response.py test_naver_analysis_execution_boundary.py test_naver_api_entry_gate.py test_naver_api_route_execution.py test_naver_api_http_contract.py test_naver_actual_integration.py test_price_provenance_integration.py \
            test_price_provenance_gate.py test_naver_provenance_boundary.py test_naver_source_evidence.py test_naver_trust_anchor.py test_trading_session_eligibility.py
      - name: Run isolated rebuild adapter tests
        if: success()
        shell: bash
        working-directory: /tmp/naver-decimal-check
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          PYTHONPATH: /tmp/naver-decimal-check
        run: |
          python -m pytest -q -p no:cacheprovider -ra \
            test_price_rebuild_adapter.py
