name: Portable Platform Manager Validation

on:
  push:
    branches:
      - feature/portable-platform-manager
    paths:
      - "portable_platform_manager/**"
      - "portable-platform-manager.ps1"
      - "portable-platform-manager-credential.ps1"
      - "portable-platform-manager-setup.ps1"
      - "test_portable_platform_manifest.py"
      - "test_portable_platform_backup_selection.py"
      - "test_portable_platform_archive_contract.py"
      - "test_portable_platform_backup_plan.py"
      - "test_portable_platform_backup_file_inspector.py"
      - "test_portable_platform_backup_staging.py"
      - "test_portable_platform_auth.py"
      - "test_portable_platform_auth_attempts.py"
      - "test_portable_platform_credential_record.py"
      - "test_portable_platform_storage_policy.py"
      - "test_portable_platform_windows_credential_store.py"
      - "test_portable_platform_windows_storage_boundary.py"
      - ".github/workflows/portable-platform-manager.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-validation:
    runs-on: windows-latest

    timeout-minutes: 15

    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install isolated test dependency
        shell: pwsh
        run: |
          python -m pip install pytest "Werkzeug==3.1.3"

      - name: Validate PPM PowerShell syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $files = @(
            "portable-platform-manager.ps1",
            "portable-platform-manager-credential.ps1",
            "portable-platform-manager-setup.ps1"
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $file, [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              throw "PPM PowerShell syntax failed: $file"
            }
            Write-Host "SYNTAX_PASS: $file"
          }
      - name: Run PPM synthetic manifest tests
        shell: pwsh
        run: |
          python -m pytest -q -p no:cacheprovider test_portable_platform_manifest.py test_portable_platform_backup_selection.py test_portable_platform_archive_contract.py test_portable_platform_backup_plan.py test_portable_platform_backup_file_inspector.py test_portable_platform_auth.py test_portable_platform_auth_attempts.py test_portable_platform_credential_record.py test_portable_platform_storage_policy.py test_portable_platform_windows_credential_store.py test_portable_platform_windows_storage_boundary.py
