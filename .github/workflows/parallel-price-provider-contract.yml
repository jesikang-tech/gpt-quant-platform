name: Parallel Price Provider Contract

on:
  push:
    branches:
      - feature/parallel-price-providers
    paths:
      - "price-provider-validation/**"
      - "naver-decimal-validation/core/price_provenance_gate.py"
      - "tools/ci_test_registration_guard.py"
      - "tools/test_ci_test_registration_guard.py"
      - ".github/workflows/price-core-regression.yml"
      - ".github/workflows/historical-replay-read-only.yml"
      - ".github/workflows/parallel-price-provider-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: price-provider-validation

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Run isolated synthetic contract tests
        env:
          PYTHONPATH: .:../naver-decimal-validation
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -q --tb=short --junitxml=k9-ci-results.xml tests/test_provider_ohlcv_contract.py tests/test_existing_decimal_reuse.py tests/test_provider_evidence.py tests/test_price_quality_adapter.py tests/test_kis_daily_response.py tests/test_kis_raw_json_binding.py tests/test_kiwoom_daily_response.py tests/test_adjustment_request.py tests/test_trading_day_certification.py tests/test_provider_analysis_boundary.py tests/test_provider_error_boundary.py tests/test_provider_daily_interface.py tests/test_provider_price_edge_cases.py tests/test_provider_pair_boundary.py tests/test_provider_usage_policy.py tests/test_kiwoom_daily_batch.py tests/test_kiwoom_instrument_scope.py tests/test_kiwoom_daily_pages.py tests/test_kiwoom_raw_json_binding.py tests/test_kiwoom_adjustment_binding.py tests/test_provider_persistence_entry.py tests/test_provider_collection_entry.py tests/test_provider_real_api_source_boundary.py
      - name: Publish synthetic test failure annotations
        if: failure()
        shell: bash
        run: |
          if [ ! -f k9-ci-results.xml ]; then
            echo "::error::JUnit results unavailable; inspect synthetic-contract job"
            exit 0
          fi
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("k9-ci-results.xml").getroot()
          count = 0
          for case in root.iter("testcase"):
              for failure in list(case.findall("failure")) + list(case.findall("error")):
                  name = case.get("classname", "") + "." + case.get("name", "")
                  message = (failure.get("message") or failure.text or "Test failed")
                  message = " ".join(message.split())[:500]
                  print("::error title=K9 synthetic test failure::" + name + ": " + message)
                  count += 1
          print("K9_REPORTED_FAILURES:", count)
          PY
  ci-registration-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install pytest
        run: python -m pip install pytest==8.3.5

      - name: Run synthetic registration guard tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest -q -p no:cacheprovider tools/test_ci_test_registration_guard.py

      - name: Verify registered provider tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python tools/ci_test_registration_guard.py
