name: Parallel Price Provider Contract

on:
  push:
    branches:
      - feature/parallel-price-providers
    paths:
      - "price-provider-validation/**"
      - "api_server.py"
      - "uat_boundary/**"
      - "test_uat_*.py"
      - "static/dashboard.js"
      - "templates/index.html"
      - "test_kiwoom_ver11_dashboard_connection.py"
      - "test_step8_decision_intelligence_get_read_only_contract.py"
      - "test_step8_decision_intelligence_post_persistence_contract.py"
      - "kiwoom_ver11_analysis.py"
      - "kiwoom_ver11_replay.py"
      - "test_kiwoom_ver11_analysis.py"
      - "test_kiwoom_ver11_api.py"
      - "test_kiwoom_ver11_replay.py"
      - "test_kiwoom_ver11_replay_api.py"
      - "naver-decimal-validation/core/price_provenance_gate.py"
      - "tools/ci_test_registration_guard.py"
      - "tools/test_ci_test_registration_guard.py"
      - ".github/workflows/price-core-regression.yml"
      - ".github/workflows/historical-replay-read-only.yml"
      - ".github/workflows/parallel-price-provider-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: price-provider-validation

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Run isolated synthetic contract tests
        env:
          PYTHONPATH: .:..:../naver-decimal-validation
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -q tests/test_provider_ohlcv_contract.py tests/test_existing_decimal_reuse.py tests/test_provider_evidence.py tests/test_price_quality_adapter.py tests/test_kis_daily_response.py tests/test_kis_raw_json_binding.py tests/test_kiwoom_daily_response.py tests/test_adjustment_request.py tests/test_trading_day_certification.py tests/test_provider_analysis_boundary.py tests/test_provider_error_boundary.py tests/test_provider_daily_interface.py tests/test_provider_price_edge_cases.py tests/test_provider_pair_boundary.py tests/test_provider_usage_policy.py tests/test_kiwoom_daily_batch.py tests/test_kiwoom_instrument_scope.py tests/test_kiwoom_daily_pages.py tests/test_kiwoom_raw_json_binding.py tests/test_kiwoom_adjustment_binding.py tests/test_provider_persistence_entry.py tests/test_provider_collection_entry.py tests/test_provider_real_api_source_boundary.py tests/test_kis_adjustment_binding.py tests/test_provider_quality_integration.py tests/test_provider_quality_entry.py tests/test_provider_quality_boundary_compatibility.py tests/test_provider_certification_acceptance.py tests/test_provider_acquisition_evidence.py tests/test_provider_corporate_action_evidence.py tests/test_provider_calendar_continuity.py tests/test_provider_instrument_quality.py tests/test_provider_cross_quality.py tests/test_provider_license_purpose.py tests/test_provider_execution_authorization.py tests/test_provider_platform_integration.py tests/test_provider_api_source_denial.py tests/test_provider_daily_bridge.py tests/test_kiwoom_platform_boundary.py tests/test_kiwoom_analysis_entrypoint_guard.py tests/test_kiwoom_price_reference_policy.py tests/test_kiwoom_ver11_daily_reference.py tests/test_kiwoom_ver11_price_input.py
  ci-registration-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install pytest
        run: python -m pip install pytest==8.3.5

      - name: Run synthetic registration guard tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest -q -p no:cacheprovider tools/test_ci_test_registration_guard.py

      - name: Verify registered provider tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python tools/ci_test_registration_guard.py

  ranking-api-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install isolated API test dependencies
        run: python -m pip install pytest==8.3.5 Flask==3.1.3 pandas==2.3.3 finance-datareader==0.9.202

      - name: Run isolated ranking API provenance tests
        env:
          PYTHONPATH: .:price-provider-validation
          PYTHONDONTWRITEBYTECODE: "1"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest -q -p no:cacheprovider test_kiwoom_ver11_dashboard_provenance.py test_kiwoom_ver11_analysis.py test_kiwoom_ver11_api.py test_kiwoom_ver11_replay.py test_kiwoom_ver11_replay_api.py test_kiwoom_ver11_dashboard_connection.py test_api_server.py test_step8_decision_intelligence_get_read_only_contract.py test_step8_decision_intelligence_post_persistence_contract.py
  isolated-kiwoom-uat:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install isolated UAT test dependencies
        run: python -m pip install pytest==8.3.5 Flask==3.1.3

      - name: Run isolated KIWOOM UAT contract tests
        env:
          PYTHONPATH: .:price-provider-validation
          PYTHONDONTWRITEBYTECODE: "1"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest -q -p no:cacheprovider test_uat_access_policy.py test_uat_flask_boundary.py test_uat_app_integration.py test_uat_launch.py
