name: Parallel Price Provider Contract

on:
  push:
    branches:
      - feature/parallel-price-providers
    paths:
      - "price-provider-validation/**"
      - "tools/ci_test_registration_guard.py"
      - "tools/test_ci_test_registration_guard.py"
      - ".github/workflows/parallel-price-provider-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: price-provider-validation

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Run isolated synthetic contract tests
        env:
          PYTHONPATH: .:../naver-decimal-validation
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -q tests/test_provider_ohlcv_contract.py tests/test_existing_decimal_reuse.py tests/test_provider_evidence.py tests/test_price_quality_adapter.py tests/test_kis_daily_response.py tests/test_kiwoom_daily_response.py tests/test_adjustment_request.py tests/test_trading_day_certification.py tests/test_provider_analysis_boundary.py tests/test_provider_error_boundary.py
  ci-registration-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install pytest
        run: python -m pip install pytest==8.3.5

      - name: Run synthetic registration guard tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest -q -p no:cacheprovider tools/test_ci_test_registration_guard.py

      - name: Verify registered provider tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python tools/ci_test_registration_guard.py
