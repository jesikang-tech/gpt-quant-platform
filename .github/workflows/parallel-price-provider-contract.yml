name: Parallel Price Provider Contract

on:
  push:
    branches:
      - feature/parallel-price-providers
    paths:
      - "price-provider-validation/**"
      - ".github/workflows/parallel-price-provider-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: price-provider-validation

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Run isolated synthetic contract tests
        env:
          PYTHONPATH: .
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -q tests/test_provider_ohlcv_contract.py tests/test_existing_decimal_reuse.py tests/test_provider_evidence.py
