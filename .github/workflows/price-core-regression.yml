name: Price Core Regression

on:
  push:
    branches:
      - validation/naver-observation-isolated
    paths:
      - '.github/workflows/price-core-regression.yml'
      - 'test_database.py'
      - 'test_price_database.py'
      - 'test_price_quality.py'
      - 'test_price_quality_boundary.py'
      - 'test_price_quality_daily_ranking.py'
      - 'test_price_quality_summary.py'
      - 'test_price_quality_overall.py'
      - 'test_development_price_write_guard.py'
      - 'test_price_loader_safety_contract.py'
      - 'price_loader.py'
      - 'price_test_support.py'
      - 'database.py'
      - 'repository.py'
      - 'config.py'
      - 'collector/etf_collector.py'
      - 'providers/fdr_provider.py'
      - 'providers/base_provider.py'
      - 'core/price_provenance_gate.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  price-core-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout isolated validation branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            config.py
            database.py
            repository.py
            price_test_support.py
            collector/etf_collector.py
            providers/fdr_provider.py
            providers/base_provider.py
            core/price_provenance_gate.py
            test_database.py
            test_price_database.py
            test_development_price_write_guard.py
            test_price_loader_safety_contract.py
            price_loader.py
            price_quality.py
            test_price_quality.py
            test_price_quality_boundary.py
            test_price_quality_daily_ranking.py
            test_price_quality_summary.py
            test_price_quality_overall.py
          sparse-checkout-cone-mode: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'

      - name: Install pinned test dependencies
        run: |
          python -m pip install \
            pytest==8.3.5 \
            pandas==2.3.3 \
            Flask==3.1.3 \
            finance-datareader==0.9.202

      - name: Run isolated price core regression
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          set -euo pipefail

          test_dir=$(mktemp -d /tmp/price-core-regression.XXXXXX)

          mkdir -p "$test_dir/collector" "$test_dir/providers" "$test_dir/core"

          cp config.py database.py repository.py \
            price_test_support.py \
            test_database.py test_price_database.py \
            test_development_price_write_guard.py \
            test_price_loader_safety_contract.py price_loader.py \
            price_quality.py test_price_quality.py \
            test_price_quality_boundary.py \
            test_price_quality_daily_ranking.py \
            test_price_quality_summary.py \
            test_price_quality_overall.py \
            "$test_dir/"

          cp collector/etf_collector.py "$test_dir/collector/"
          cp providers/fdr_provider.py providers/base_provider.py \
            "$test_dir/providers/"
          cp core/price_provenance_gate.py "$test_dir/core/"

          cd "$test_dir"

          export PYTHONPATH="$test_dir"
          export TMPDIR="$test_dir"

          python -m pytest -q -p no:cacheprovider \
            --basetemp="$test_dir/pytest-tmp" \
            test_database.py::test_database_initialization_is_idempotent \
            test_database.py::test_etf_collector_persists_mock_list_and_csv \
            test_price_database.py::test_price_count_order_and_ticker_filter \
            test_development_price_write_guard.py \
            test_price_loader_safety_contract.py \
            test_price_quality.py \
            test_price_quality_boundary.py \
            test_price_quality_daily_ranking.py \
            test_price_quality_summary.py \
            test_price_quality_overall.py
