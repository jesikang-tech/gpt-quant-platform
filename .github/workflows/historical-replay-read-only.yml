          mkdir -p "$replay_dir/core"
          cp "core/decision_confidence_intelligence.py" "$replay_dir/core/decision_confidence_intelligence.py"
          mkdir -p "$replay_dir/core"
          cp "core/decision_confidence_recommendation.py" "$replay_dir/core/decision_confidence_recommendation.py"
          mkdir -p "$replay_dir/core"
          cp "core/market_regime.py" "$replay_dir/core/market_regime.py"
          mkdir -p "$replay_dir/core"
          cp "core/market_strategy.py" "$replay_dir/core/market_strategy.py"
          mkdir -p "$replay_dir/core"
          cp "core/optimization_scoring.py" "$replay_dir/core/optimization_scoring.py"
          mkdir -p "$replay_dir/core"
          cp "core/platform_auth.py" "$replay_dir/core/platform_auth.py"
          mkdir -p "$replay_dir/core"
          cp "core/point_in_time_analysis.py" "$replay_dir/core/point_in_time_analysis.py"
          mkdir -p "$replay_dir/core"
          cp "core/portfolio_advisor.py" "$replay_dir/core/portfolio_advisor.py"
          mkdir -p "$replay_dir/core"
          cp "core/portfolio_conversational.py" "$replay_dir/core/portfolio_conversational.py"
          mkdir -p "$replay_dir/core"
          cp "core/portfolio_decision_intelligence.py" "$replay_dir/core/portfolio_decision_intelligence.py"
          mkdir -p "$replay_dir/core"
          cp "core/portfolio_explainability.py" "$replay_dir/core/portfolio_explainability.py"
          mkdir -p "$replay_dir/core"
          cp "core/portfolio_intelligence_score.py" "$replay_dir/core/portfolio_intelligence_score.py"
          mkdir -p "$replay_dir/core"
          cp "core/price_provenance_gate.py" "$replay_dir/core/price_provenance_gate.py"
          cp "current_analysis.py" "$replay_dir/current_analysis.py"
          cp "database.py" "$replay_dir/database.py"
          cp "factor_engine.py" "$replay_dir/factor_engine.py"
          cp "price_test_support.py" "$replay_dir/price_test_support.py"
          mkdir -p "$replay_dir/providers"
          cp "providers/base_provider.py" "$replay_dir/providers/base_provider.py"
